[workspace]
resolver = "2"
members = ["crates/core", "crates/server", "crates/cli"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
authors = ["spotwatt"]

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"

# Smaller, faster release binary for a 24/7 daemon.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
