# spotwatt configuration — copy to config.toml and adjust.
# All fields are optional; the values below are the defaults.

# Spot-price region: NO1 (Oslo/Øst), NO2 (Kristiansand/Sør),
# NO3 (Trondheim/Midt), NO4 (Tromsø/Nord), NO5 (Bergen/Vest).
region = "NO1"

# Address the dashboard listens on. Use 0.0.0.0:8080 to expose on the LAN.
listen = "127.0.0.1:8080"

# sqlx connection string. mode=rwc creates the file if missing.
database_url = "sqlite:spotwatt.db?mode=rwc"

# How often the scheduler re-evaluates every pending job (seconds, min 5).
tick_seconds = 60

# Maximum jobs allowed to run simultaneously.
max_concurrent_jobs = 2

# How often to re-fetch the price curve from hvakosterstrommen.no (minutes).
price_refresh_minutes = 30

# Site power budget in watts. When set, the scheduler will not start jobs whose
# combined draw would exceed it — peak-shaving for the capacity tariff
# (kapasitetsledd). Leave unset (commented out) to cap by job count only.
# max_power_watts = 5000

# Hard wall-clock cap on a single job run, in minutes. A job still running after
# this is killed and recorded as failed, so a hung command can't hold a slot.
job_timeout_minutes = 720

# Effective-price model. spotwatt schedules and prices against what the customer
# actually pays, not bare spot: energy + grid energy + electricity tax, all under
# VAT. Adjust to your own tariff sheet and deal.
[tariff]
# How the energy itself is priced:
#   "spot"       — hourly spot minus the strømstøtte refund (default)
#   "norgespris" — the fixed state price; spot is irrelevant, and the only
#                  hourly variation left is the grid day/night step
energy_model = "spot"
norgespris_nok_per_kwh = 0.40        # Norgespris energy price, ex-VAT (0.50 incl)
grid_energy_day_nok_per_kwh = 0.40   # nettleie energy component, weekdays 06–22, ex-VAT
grid_energy_night_nok_per_kwh = 0.32 # nettleie at night (22–06) and weekends, ex-VAT
electricity_tax_nok_per_kwh = 0.1644 # elavgift, ex-VAT
vat_rate = 0.25                      # 0.0 for the VAT-exempt northern counties
subsidy_threshold_nok_per_kwh = 0.9375 # strømstøtte kicks in above this (ex-VAT)
subsidy_rate = 0.90                  # fraction of spot above the threshold refunded
